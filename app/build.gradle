apply plugin: 'com.android.application'
apply plugin: 'com.github.sherter.google-java-format'

buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath 'gradle.plugin.com.github.sherter.google-java-format:google-java-format-gradle-plugin:0.9'
    }
}

android {
    compileSdkVersion 36
    buildToolsVersion "36.0.0"
    namespace 'edu.luc.etl.cs313.android.simplestopwatch'

    defaultConfig {
        applicationId "edu.luc.etl.cs313.android.simplestopwatch"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug {
            testCoverageEnabled true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            useJUnitPlatform()
        }
    }
    testFixtures {
        enable = true
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.10.0'

    // shared GUI test superclass, used by both the Robolectric unit test and
    // the instrumented androidTest - built as a test-library (testFixtures)
    // since AGP 9's newer sourceSet model no longer supports the old
    // src/sharedTest sourceSets-hack sharing pattern cleanly
    testFixturesImplementation 'junit:junit:4.13.2'
    testFixturesImplementation 'androidx.test:rules:1.7.0'

    // model-level unit tests on JUnit 5/6
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Robolectric GUI test stays on JUnit 4 via the Vintage engine - Robolectric
    // has no official JUnit 5 support
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'

    testImplementation 'androidx.test:rules:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'

    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

tasks.withType(Test).configureEach {
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// AGP 9's newer variant/DSL model removes access to the legacy
// android.applicationVariants / android.getBootClasspath() APIs this task
// used to rely on; migrated onto the androidComponents Variant API instead.
tasks.register("javadoc", Javadoc) {
    source = android.sourceSets.main.java.srcDirs
}

androidComponents {
    onVariants(selector().withBuildType("debug")) { variant ->
        tasks.named("javadoc", Javadoc).configure {
            classpath += project.files(sdkComponents.bootClasspath)
            classpath += variant.compileConfiguration
        }
    }
}
